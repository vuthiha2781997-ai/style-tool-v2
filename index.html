<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Style Finder Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 40px;
    }
    .container {
      background: white;
      padding: 24px;
      max-width: 700px;
      margin: auto;
      border-radius: 8px;
    }
    .dropzone {
      border: 2px dashed #aaa;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
    }
    img {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Product Style Finder</h2>

  <div class="dropzone" id="dropzone">
    Click, paste (Ctrl+V) or drop image here
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display:none">

  <img id="preview" />

  <br><br>
  <button onclick="analyze()">Analyze Style</button>

  <div id="result"></div>
</div>

<script>
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");

  dropzone.onclick = () => fileInput.click();

  fileInput.onchange = () => {
    showImage(fileInput.files[0]);
  };

  document.addEventListener("paste", (event) => {
    const items = event.clipboardData.items;
    for (let item of items) {
      if (item.type.indexOf("image") !== -1) {
        const file = item.getAsFile();
        showImage(file);
      }
    }
  });

  function showImage(file) {
    const reader = new FileReader();
    reader.onload = () => {
      preview.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function analyze() {
    document.getElementById("result").innerHTML =
      "Image received. AI style analysis will be added next.";
  }
</script>

</body>
</html>
